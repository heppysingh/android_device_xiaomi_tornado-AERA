name: Build AERA Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'AERA Manifest Branch'
        required: true
        default: 'aera-16.0'
        type: choice
        options:
          - 'aera-16.0'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'aera_tornado-bp2a-eng'
        type: choice
        options:
          - 'aera_tornado-bp2a-eng'
          - 'aera_tornado-eng'
          - 'twrp_tornado-bp2a-eng'
          - 'twrp_tornado-eng'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker system prune -af || true

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Create 16GB swap
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32z1-dev libxml2-utils xsltproc unzip \
            python3 python-is-python3 rsync bc gperf libssl-dev \
            libncurses5-dev libncursesw5-dev \
            lz4 cpio liblzma-dev optipng rustc cargo git-lfs

      - name: Install repo
        run: |
          mkdir -p ~/.local/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Load private key and set strict permissions
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Pre-populate GitHub's host keys to prevent host verification prompts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Optional: Force SSH instead of HTTPS for GitHub repos
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Sync AERA Sources
        run: |
          git config --global user.name "AERA Builder"
          git config --global user.email "builder@aera.recovery"
          git config --global color.ui true

          mkdir -p /home/runner/aera
          cd /home/runner/aera

          # Using SSH URL for the manifest repository
          repo init -u git@github.com:AERA-Recovery/android_manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --git-lfs
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --
          no-tags
      - name: Copy Device Tree
        run: |
          mkdir -p /home/runner/aera/device/xiaomi/tornado
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            ./ /home/runner/aera/device/xiaomi/tornado/

      - name: Build AERA Recovery
        run: |
          cd /home/runner/aera
          set +e
          source build/envsetup.sh
          set -e
          echo "=== Lunching target: ${{ github.event.inputs.BUILD_TARGET }} ==="
          lunch ${{ github.event.inputs.BUILD_TARGET }}
          echo "=== Building vendorbootimage ==="
          mka vendorbootimage

      - name: Show Build Output
        if: always()
        run: |
          find /home/runner/aera/out/target/product/tornado -maxdepth 2 -type f || true

      - name: Fix Permissions
        if: always()
        run: |
          sudo chown -R runner:runner /home/runner/aera/out || true
          sudo chmod -R a+rX /home/runner/aera/out || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-tornado
          if-no-files-found: warn
          path: |
            /home/runner/aera/out/target/product/tornado/AERA*.zip
            /home/runner/aera/out/target/product/tornado/AERA*.img
            /home/runner/aera/out/target/product/tornado/vendor_boot.img
            /home/runner/aera/out/target/product/tornado/vendorboot.img
            /home/runner/aera/out/target/product/tornado/vendor_ramdisk_recovery.cpio
            /home/runner/aera/out/target/product/tornado/recovery.img
            /home/runner/aera/out/target/product/tornado/boot.img
