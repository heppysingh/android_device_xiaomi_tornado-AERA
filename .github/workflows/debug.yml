name: Remote SSH Debug Runner

on:
  workflow_dispatch:

jobs:
  ssh-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker system prune -af || true


      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main
      # ---------------------------------------------------------
      # WORKSPACE
      # ---------------------------------------------------------

      - name: Initialize workspace on the large disk
        id: pwd
        run: |
          sudo mkdir -p /mnt/workspace
          sudo chown -R "$USER:$USER" /mnt/workspace
          ln -sf /mnt/workspace "$HOME/workspace"
          echo 'cd /mnt/workspace' >> "$HOME/.bashrc"
          echo "workspace-folder=/mnt/workspace" >> "$GITHUB_OUTPUT"
          df -h

      # ---------------------------------------------------------
      # SWAP
      # ---------------------------------------------------------

      - name: Create 16GB swap
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 22

      # ---------------------------------------------------------
      # DEPENDENCIES
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git aria2 ccache python3 python-is-python3 bc bison build-essential \
            curl flex g++-multilib gcc-multilib gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev unzip openssh-server tmux

          sudo curl --create-dirs -L \
            -o /usr/local/bin/repo \
            https://storage.googleapis.com/git-repo-downloads/repo

          sudo chmod a+rx /usr/local/bin/repo

          repo --version

      # ---------------------------------------------------------
      # UPTERM SSH SESSION
      # ---------------------------------------------------------

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
 

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fox_16
          if-no-files-found: warn
          path: |
            /crave/android/out/target/product/tornado/*.zip
            /crave/android/out/target/product/tornado/*.img 
